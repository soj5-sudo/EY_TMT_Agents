name: Verify and refresh

on:
  push:
    branches: [main]
  schedule:
    # Monday morning, after the Indian and European quarterly cycles have
    # published. The harvest is cheap and the documents change slowly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

      # Publishing is handled by Vercel's own Git integration, which is
      # connected to this repository and builds every push to main. There is no
      # token here and none is needed: a push is the deploy.
      - name: Deployment
        run: echo "::notice title=Deploy::Vercel builds this commit from its Git connection. No credential is stored in this workflow."

  refresh-published-documents:
    # Only on the schedule or when asked. A push does not need to re-scrape.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Several investor relations hosts refuse requests from hosting networks
      # while serving the identical URL to an ordinary one. This job re-reads
      # the published spreadsheets and results releases and commits the result,
      # which is what the deployment falls back to when it is refused. If the
      # runner is refused too, the step reports it and leaves the existing
      # harvest in place rather than replacing it with nothing.
      - name: Harvest published results files
        run: npm run harvest:ir

      - name: Commit if the published figures moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- lib/data/ir-ledger-snapshot.ts; then
            echo "::notice title=Harvest::No change in the published figures."
            exit 0
          fi
          git add lib/data/ir-ledger-snapshot.ts
          git commit -m "Refresh the harvested results files

          Automated re-read of the investor relations documents. Vercel
          publishes this commit from its Git connection."
          git push
